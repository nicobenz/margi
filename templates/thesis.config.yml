# margi configuration — see https://github.com/nicobenz/margi
format: typst
main: {{main}}               # entry file; #include "..." is followed

# true: agents in this repo may not edit thesis sources (.typ, .bib, …) or run git
# commit/push/reset/checkout, whatever you ask them. false: only margi's own commands keep to
# the human-writing rules. After changing it, run `uv run margi init`: it updates
# .claude/settings.json and commits both, so the switch stays visible in git history.
protect_thesis: true

# Optional aliases for `/margi grade <alias>`; otherwise use numbers (2.1) or titles.
sections: {}
#  prior-work: { heading: "Prior Work" }

count: chars                 # chars | chars_no_spaces | words (used by `/margi outline`)

propose:
  source: PROPOSAL.md        # your plan in your own words (override with --from)

literature:
  dir: lit                   # PDFs rated by `/margi read`
  bib: {{bib}}

rubric: default              # margi/rubrics/<id>/ overrides the bundled rubric

docs:
  min_completeness: 0.7      # grade/read refuse below this share of documented fields

ai_identity:
  name: margi-bot
  email: margi-bot@users.noreply.github.com

github:
  label: margi
