  }

  var tsNum = function (ts) { var t = Date.parse(ts); return isNaN(t) ? 0 : t; };
  function multiple(runs, k) {
    var t0 = tsNum(runs[0].timestamp), t1 = tsNum(runs[runs.length - 1].timestamp), byTime = t1 > t0;
    var pts = runs.map(function (r, i) { return r.scores[k] ? { t: byTime ? tsNum(r.timestamp) : i, v: r.scores[k].score / r.scores[k].max * rub.max, raw: r.scores[k], ts: r.timestamp } : null; })
      .filter(Boolean);
    var W = 200, H = 72, padL = 14, padR = 6, padT = 6, padB = 6;
    var lo = byTime ? t0 : 0, hi = byTime ? t1 : runs.length - 1;
    var x = function (t) { return padL + (hi > lo ? (t - lo) / (hi - lo) : 0.5) * (W - padL - padR); };
    var y = function (v) { return padT + (1 - (v - rub.min) / (rub.max - rub.min)) * (H - padT - padB); };
    var grid = [rub.min, rub.max].map(function (v) {
      return '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--chart-grid)" stroke-width="1"/>' +
        '<text x="0" y="' + (y(v) + 3.5) + '" font-size="10" fill="var(--ink-3)" font-family="Libertinus Sans, sans-serif">' + v + '</text>';
    }).join("");
    var mid = (rub.min + rub.max) / 2;
    grid += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(mid) + '" y2="' + y(mid) + '" stroke="var(--chart-grid)" stroke-width="1" stroke-dasharray="2 3"/>';
    var path = pts.map(function (p, j) { return (j ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1); }).join(" ");
    var dots = pts.map(function (p) {
      var low = isLow(p.raw);
      return '<circle cx="' + x(p.t).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="3.2" fill="' + (low ? "var(--red)" : "var(--chart)") + '" stroke="var(--page)" stroke-width="1.5"/>' +
        '<rect class="hit" x="' + (x(p.t) - 9).toFixed(1) + '" y="0" width="18" height="' + H + '" fill="transparent" data-tip="' + esc(fmtDate(p.ts) + ": " + fmtScore(p.raw.score) + " / " + p.raw.max) + '" data-x="' + (x(p.t) / W * 100).toFixed(2) + '" data-y="' + y(p.v).toFixed(1) + '"/>';
    }).join("");
    var last = pts[pts.length - 1];
    var label = esc(catTitle(k)) + ": " + pts.map(function (p) { return fmtDate(p.ts) + " " + fmtScore(p.raw.score) + " of " + p.raw.max; }).join(", ");
    return '<figure class="mult"><figcaption><span>' + esc(catTitle(k)) + '</span><b>' + fmtScore(last.raw.score) + '</b></figcaption>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + label + '">' + grid +
      '<path d="' + path + '" fill="none" stroke="var(--chart)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' + dots + '</svg>' +
      '<div class="axis"><span>' + fmtDate(runs[0].timestamp, false, true) + '</span><span>' + fmtDate(runs[runs.length - 1].timestamp, false, true) + '</span></div>' +
      '<div class="tip" role="presentation"></div></figure>';
  }

  var SEV = { major: 0, minor: 1, note: 2 };
  var bySeverity = function (a, b) {
    return (SEV[a.severity] - SEV[b.severity]) || String(a.created).localeCompare(String(b.created)) ||
      ((a.anchor ? a.anchor.line_start : 1e9) - (b.anchor ? b.anchor.line_start : 1e9));
  };
  var lastBy = function (c, by) { var h = c.history.filter(function (x) { return x.by === by; }); return h[h.length - 1]; };
  var VERDICT = { resolved: "resolved", open: "still open", withdrawn: "withdrawn" };
  var ANSWER = { addressed: "addressed", disputed: "disputed", wont_fix: "won’t fix" };

  // "Since 3 Oct: 4 of 6 major comments resolved · 1 awaiting a grade · 1 open"
  function progress(mine) {
    if (!mine.some(function (c) { return c.history.length; })) return '';
    var maj = majorsOf(mine), base = maj.length ? maj : mine;
    var n = function (st) { return base.filter(function (c) { return st.indexOf(c.state) >= 0; }).length; };
    var done = n(["resolved"]), withdrawn = n(["withdrawn"]), waiting = n(["addressed", "disputed"]), open = n(["open"]), kept = n(["wont_fix"]);
    var first = base.map(function (c) { return c.created; }).sort()[0];
    var parts = [];
    if (withdrawn) parts.push(withdrawn + ' withdrawn');
    if (waiting) parts.push(waiting + ' answered, awaiting a grade');
    if (open) parts.push(open + ' open');
    if (kept) parts.push(kept + ' kept as is');
    return '<p class="progress">Since ' + fmtDate(first, false, true) + ': <b>' + done + ' of ' + base.length + '</b> ' +
      (maj.length ? 'major ' : '') + (base.length === 1 ? 'comment' : 'comments') + ' resolved' + (parts.length ? ' · ' + parts.join(' · ') : '') + '</p>';
  }

  function stateLine(c) {
    var v = lastBy(c, "margi"), y = lastBy(c, "student"), last = c.history[c.history.length - 1];
    var txt = c.state === "open" ? (v && v.value === "open" ? 'Still open · checked ' + fmtDate(v.timestamp, false, true) : 'Open since ' + fmtDate(c.created, false, true))
      : c.state === "addressed" ? 'Addressed · awaiting a grade'
      : c.state === "disputed" ? 'Disputed · awaiting a grade'
      : (c.state === "wont_fix" ? 'Won’t fix · your call, ' : (c.state === "resolved" ? 'Resolved ' : 'Withdrawn ')) + fmtDate(last ? last.timestamp : c.created, false, true);
    var sig = AWAIT[c.state] && c.signal ? '<span class="sig ' + esc(c.signal) + '">passage ' + esc(c.signal) + '</span>' : '';
    var pick = AWAIT[c.state] ? '<label class="pick"><input type="checkbox" data-pick="' + esc(c.ref) + '"' + (state.pick.indexOf(c.ref) >= 0 ? ' checked' : '') +
      ' aria-label="Answer ' + esc(c.ref) + '"><span aria-hidden="true">Answer</span></label>' : '';
    return '<div class="cstate"><span><span class="caps">' + esc(txt) + '</span>' + (sig ? ' · ' + sig : '') + '</span>' + pick + '</div>';
  }

  function thread(c) {
    if (!c.history.length) return '';
    return '<ol class="thread">' + c.history.map(function (h) {
      if (h.by === "student") {
        return '<li><span class="who you caps">You, ' + fmtDate(h.timestamp, false, true) + '</span>' + esc(ANSWER[h.value] || h.value) +
          (h.reason ? ' — <q class="said">' + esc(h.reason) + '</q>' : '') + '</li>';
      }
      return '<li><span class="who caps">margi, ' + fmtDate(h.timestamp, false, true) + '</span>' + esc(VERDICT[h.value] || h.value) +
        (h.reason ? ' — ' + esc(h.reason) : '') + '</li>';
    }).join("") + '</ol>';
  }

  // one apparatus entry: locator, lemma ] , note; tracked comments add their thread and state line
  function entry(c, elId) {
    var a = c.anchor, lemma, tracked = !!c.ref;
    if (a) {
      var at = tracked && c.now && c.signal !== "changed" ? c.now : a;
      var lines = at.line_start === at.line_end ? at.line_start : at.line_start + "–" + at.line_end;
      var st = tracked ? '' : a.anchor_status === "unresolved" ? '<span class="anchor-state">passage not found</span>' : a.anchor_status === "relocated" ? '<span class="anchor-state">moved</span>' : '';
      lemma = '<span class="loc" title="' + esc(a.file) + (tracked && c.signal === "changed" ? ' (lines when graded)' : '') + '">' + lines + '</span><div><div class="lemma-line"><span class="lemma">' + esc(a.quote) + '</span><span class="br">]</span>' + st + '</div>';
    } else {
      lemma = '<span class="loc">—</span><div><div class="lemma-line"><span class="muted">not tied to a passage</span><span class="br">]</span></div>';
    }
    var label = tracked ? '<span class="ref">' + esc(c.ref) + '</span>' : esc(c.id.split(":").pop());
    var picked = tracked && state.pick.indexOf(c.ref) >= 0;
    return '<li class="entry' + (picked ? ' picked' : '') + '" id="' + esc(elId) + '"' + (a ? ' title="' + esc(a.file) + '"' : '') + '>' + lemma +
      '<div class="note"><span class="sev ' + esc(c.severity) + '">' + esc(c.severity) + '</span> <span class="muted">· ' + esc(catTitle(c.category)) + ' · ' + label +
      (a ? ' · <span class="mono">' + esc(a.file.replace(/^.*\//, "")) + '</span>' : '') + '</span> — ' + esc(c.body) +
      (tracked ? todosFor(c.ref).map(function (t) { return ' <a class="tlink" href="#tab=todos" data-tabgo="todos">→ todo: ' + esc(t.title) + '</a>'; }).join("") : '') + '</div>' +
      (tracked ? thread(c) + stateLine(c) : '') + '</div></li>';
  }

  function openComments(mine, nRuns) {
    var list = mine.filter(function (c) { return AWAIT[c.state]; }).sort(bySeverity);
    var counts = { all: list.length, major: 0, minor: 0 };
    list.forEach(function (c) { counts[c.severity]++; });
    var catsPresent = [];
    list.forEach(function (c) { if (catsPresent.indexOf(c.category) < 0) catsPresent.push(c.category); });
    if (state.cat !== "all" && catsPresent.indexOf(state.cat) < 0) state.cat = "all";
    var shown = list.filter(function (c) { return (state.sev === "all" || c.severity === state.sev) && (state.cat === "all" || c.category === state.cat); });
    var seg = ["all", "major", "minor"].map(function (k) {
      return '<button type="button" data-sev="' + k + '" aria-pressed="' + (state.sev === k) + '">' + (k === "all" ? "All" : k[0].toUpperCase() + k.slice(1)) + ' ' + counts[k] + '</button>';
    }).join("");
    var catSel = catsPresent.length > 1 ? '<label><span class="visually-hidden">Category</span><select id="catsel"><option value="all">All categories</option>' +
      catsPresent.map(function (c) { return '<option value="' + esc(c) + '"' + (state.cat === c ? " selected" : "") + '>' + esc(catTitle(c)) + '</option>'; }).join("") + '</select></label>' : '';
    var closedN = mine.length - list.length;
    var sub = nRuns > 1 || closedN ? 'from ' + plural(nRuns, "grade") : plural(list.length, "comment");
    return '<div class="block"><h3><span class="caps">Open comments</span><span class="muted" style="font-size:14px">' + sub + '</span></h3>' +
      (list.length ? '<div class="filters"><div class="seg" role="group" aria-label="Severity">' + seg + '</div>' + catSel + '</div>' : '') +
      (shown.length ? '<ol class="entries">' + shown.map(function (c) { return entry(c, "c-" + c.ref); }).join("") + '</ol>'
        : '<p class="muted">' + (list.length ? 'No open comments match these filters.' : mine.length ? 'Every comment on this section is closed.' : 'This section has no major or minor comments.') + '</p>') +
      (list.length ? '<p class="lcnote">Tick the comments you want to answer: addressed, disputed or won’t fix. The next grade checks addressed and disputed ones.</p>' : '') + '</div>';
  }

  function notes(g, idx, nRuns) {
    var list = g.comments.filter(function (c) { return c.severity === "note"; });
    if (!list.length) return '';
    return '<div class="block"><h3><span class="caps">Noted strengths</span><span class="muted" style="font-size:14px">' + (nRuns > 1 ? 'grade ' + (idx + 1) + ' · ' : '') + fmtDate(g.timestamp, false, true) + '</span></h3>' +
      '<ol class="entries">' + list.sort(bySeverity).map(function (c) { return entry(c, "n-" + c.id.split(":").pop()); }).join("") + '</ol></div>';
  }

  function closedComments(mine) {
    var list = mine.filter(function (c) { return !AWAIT[c.state]; }).sort(bySeverity);
    if (!list.length) return '';
    return '<details class="block closed" id="closed"' + (state.closedOpen ? ' open' : '') + '><summary><span class="caps">Closed</span><span class="tog">' +
      plural(list.length, "comment") + '</span></summary><ol class="entries">' + list.map(function (c) { return entry(c, "c-" + c.ref); }).join("") + '</ol></details>';
  }

  function respondBar() {
    var todo = state.tab === "todos", refs = todo ? state.tpick : state.pick;
    var hint = todo ? plural(refs.length, "todo") + ' to mark done in your agent' : plural(refs.length, "comment") + ' to answer in your agent';
    return '<div class="respond' + (todo ? ' standalone' : '') + '" id="respond"' + (refs.length ? '' : ' hidden') + '><span class="hint">' + (refs.length ? hint : '') + '</span>' +
      (refs.length ? cmdChip((todo ? "/margi todos done " : "/margi respond ") + refs.join(" ")) + '<button type="button" class="clear" data-unpick>Clear</button>' : '') + '</div>';
  }
  function updatePicks() {
    var bar = $("respond"); if (bar) bar.outerHTML = respondBar();
    var list = state.tab === "todos" ? state.tpick : state.pick;
    document.querySelectorAll("[data-pick]").forEach(function (b) {
      var on = list.indexOf(b.getAttribute("data-pick")) >= 0;
      b.checked = on; var li = b.closest(".entry"); if (li) li.classList.toggle("picked", on);
    });
  }

  function overviewPanel() {
    var weakest = [];
    gradedIds.forEach(function (id) {
      var g = latest(id);
      var low = Object.keys(g.scores).filter(function (k) { return isLow(g.scores[k]); })
        .sort(function (a, b) { return g.scores[a].score / g.scores[a].max - g.scores[b].score / g.scores[b].max; });
      if (low.length) weakest.push({ id: id, ks: low, g: g, min: g.scores[low[0]].score / g.scores[low[0]].max });
    });
    weakest.sort(function (a, b) { return a.min - b.min; });
    var title = function (id) { var s = sections.filter(function (x) { return x.id === id; })[0]; return s ? s.title : id; };
    if (!gradedIds.length && setupOpen) return setupBlock(true);
    if (!gradedIds.length) {
      return '<div class="empty" style="padding:0"><h2>Nothing graded yet</h2><p>Scores and anchored comments appear here once a section is graded. Select a section to see its details.</p>' +
        ((D.next_steps || [])[0] ? '<p>' + cmdChip(D.next_steps[0].command) + '</p><p class="muted">' + esc(D.next_steps[0].reason) + '</p>' : '') + '</div>';
    }
    return '<h2>Needs attention</h2><div class="meta"><span>Select a section to open its scores, history and comments.</span></div>' + setupBlock(false) +
      '<div class="block"><h3><span class="caps">Scores of ' + Math.floor(lowCut) + ' or below</span><span class="muted" style="font-size:14px">' + plural(weakest.length, "section") + '</span></h3>' +
      (weakest.length ? '<ul class="list">' + weakest.slice(0, 12).map(function (w) {
        return '<li><a href="#tab=sections&s=' + encodeURIComponent(w.id) + '" data-goto="' + esc(w.id) + '"><span class="sid">' + esc(w.id) + '</span> ' + esc(title(w.id)) + '</a> <span class="muted">· ' +
          w.ks.map(function (k) { return esc(catTitle(k)) + ' <span class="score low" title="' + esc(scoreTitle(k, w.g.scores[k])) + '">' + fmtScore(w.g.scores[k].score) + '</span>'; }).join(', ') + '</span></li>';
      }).join("") + '</ul>' : '<p class="muted">No category is scored that low in the latest grades.</p>') + '</div>' +
      '<div class="block"><h3><span class="caps">Changed since grading</span></h3>' + (function () {
        var ch = gradedIds.filter(function (id) { return latest(id).changed.length; });
        return ch.length ? '<ul class="list">' + ch.map(function (id) {
          return '<li><a href="#tab=sections&s=' + encodeURIComponent(id) + '" data-goto="' + esc(id) + '"><span class="sid">' + esc(id) + '</span> ' + esc(title(id)) + '</a> ' + cmdChip("/margi grade " + id) + '</li>';
        }).join("") + '</ul>' : '<p class="muted">Every graded section matches its latest grade' +
          (D.thesis_commit ? ' as of commit <span class="mono">' + esc(D.thesis_commit.sha.slice(0, 7)) + '</span>' : '') + '.</p>';
      })() + '</div>' + (function () {
        var by = {};
        CM.forEach(function (c) { if (c.state === "addressed" || c.state === "disputed") by[c.section] = (by[c.section] || 0) + 1; });
        var ids = sections.map(function (s) { return s.id; }).filter(function (id) { return by[id]; });
        return ids.length ? '<div class="block"><h3><span class="caps">Answered, awaiting a grade</span><span class="muted" style="font-size:14px">' + plural(awaitingN, "comment") + '</span></h3><ul class="list">' +
          ids.map(function (id) {
            return '<li><a href="#tab=sections&s=' + encodeURIComponent(id) + '" data-goto="' + esc(id) + '"><span class="sid">' + esc(id) + '</span> ' + esc(title(id)) + '</a> <span class="muted">· ' + by[id] + '</span> ' + cmdChip("/margi grade " + id) + '</li>';
          }).join("") + '</ul></div>' : '';
      })();
  }

  // ------------------------------------------------------------------ timeline tab
  function tlRows() { // sections down to level 2; deeper sections fold into their parent row
    return sections.filter(function (s) { return !s.orphan && s.level <= 2; });
  }
  function rowOf(rows, sid) {
    var best = null;
    rows.forEach(function (r) { if (covers(r.id, sid) && (!best || r.id.length > best.id.length)) best = r; });
    return best;
  }
  function timelineView() {
    if (!TL || (!TL.deadline && !(TL.events || []).length && !(TL.commits || []).length)) {
      return '<div class="sheet empty"><h3>No timeline yet</h3><p>Document the submission date and milestones, and margi sets them against your grades, writing and commits.</p><p>' + cmdChip("/margi challenge deadline") + '</p></div>';
    }
    var wrapW = Math.max(720, Math.min(1472, ($("view").clientWidth || 1200) - 34));
    return '<div class="sheet"><div class="tlwrap" id="tlwrap">' + timelineChart(wrapW) + '<div class="tip" role="presentation"></div></div>' + timelineKey() +
      (D.outline.history.length ? '' : '<p class="tlnote">No length snapshots yet: ' + cmdChip("/margi outline") + ' records one.</p>') + '</div>' + milestoneTable();
  }
  function timelineChart(W) {
    var dom = tlDomain(), L = 200, R = 16, top = 26, lenH = 84, rowH = 28, comH = 28;
    var rows = tlRows();
    var H = top + lenH + 10 + rows.length * rowH + comH + 8;
    var x = function (d) { return L + ((typeof d === "number" ? d : dayNum(d)) - dom[0]) / ((dom[1] - dom[0]) || 1) * (W - L - R); };
    var out = [], hits = [];
    var tip = function (cx, cy, text, extra) {
      hits.push('<rect class="hit" x="' + (cx - 7).toFixed(1) + '" y="' + (cy - 9).toFixed(1) + '" width="14" height="18" fill="transparent" data-tip="' + esc(text) + '" data-x="' + cx.toFixed(1) + '" data-y="' + cy.toFixed(1) + '"' + (extra || '') + '/>');
    };
    // month grid and labels
    var d0 = new Date(dom[0] * DAY), months = [], step = (dom[1] - dom[0]) > 400 ? 3 : (dom[1] - dom[0]) > 200 ? 2 : 1;
    var m = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + (d0.getUTCDate() === 1 ? 0 : 1), 1));
    while (m.getTime() / DAY <= dom[1]) { months.push(new Date(m)); m.setUTCMonth(m.getUTCMonth() + step); }
    months.forEach(function (mm) {
      var xx = x(Math.floor(mm.getTime() / DAY));
      out.push('<line x1="' + xx + '" x2="' + xx + '" y1="' + (top - 6) + '" y2="' + (H - 4) + '" stroke="var(--chart-grid)"/>' +
        '<text class="tick" x="' + (xx + 3) + '" y="' + (top - 10) + '">' + MONTHS[mm.getUTCMonth()] + (mm.getUTCMonth() === 0 || mm === months[0] ? ' ' + mm.getUTCFullYear() : '') + '</text>');
    });
    // length row: snapshots as a line, the current length as an open dot, the goal dashed
    var hist = D.outline.history.map(function (h) { return { d: dayNum(h.timestamp), v: h.total, ts: h.timestamp }; });
    var nowV = D.outline.total, nowD = TL.reference ? dayNum(TL.reference) : today;
    var vmax = Math.max(TL.length || 0, nowV || 0, Math.max.apply(null, hist.map(function (h) { return h.v; }).concat([1]))) * 1.08;
    var ly = function (v) { return top + lenH - 8 - v / vmax * (lenH - 18); };
    out.push('<text class="cap" x="0" y="' + (top + 14) + '">Length</text><text class="fig" x="0" y="' + (top + 32) + '">' + fmtN(nowV) + ' ' + unitName(TL.unit) + '</text>');
    out.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ly(0) + '" y2="' + ly(0) + '" stroke="var(--rule)"/>');
    if (TL.length) {
      out.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ly(TL.length) + '" y2="' + ly(TL.length) + '" stroke="var(--ink-3)" stroke-dasharray="4 4"/>' +
        '<text class="tick" x="' + (L + 4) + '" y="' + (ly(TL.length) - 4) + '">goal ' + fmtN(TL.length) + '</text>');
    }
    if (hist.length) {
      out.push('<path d="' + hist.map(function (h, i) { return (i ? "L" : "M") + x(h.d).toFixed(1) + " " + ly(h.v).toFixed(1); }).join(" ") + '" fill="none" stroke="var(--chart)" stroke-width="1.6" stroke-linejoin="round"/>');
      hist.forEach(function (h) {
        out.push('<circle cx="' + x(h.d).toFixed(1) + '" cy="' + ly(h.v).toFixed(1) + '" r="3.2" fill="var(--chart)" stroke="var(--page)" stroke-width="1.5"/>');
        tip(x(h.d), ly(h.v), fmtDate(h.ts) + ": " + fmtN(h.v) + " " + unitName(TL.unit));
      });
    }
    if (nowV) {
      var last = hist[hist.length - 1];
      if (last) out.push('<line x1="' + x(last.d).toFixed(1) + '" y1="' + ly(last.v).toFixed(1) + '" x2="' + x(nowD).toFixed(1) + '" y2="' + ly(nowV).toFixed(1) + '" stroke="var(--chart)" stroke-width="1" stroke-dasharray="2 3"/>');
      out.push('<circle cx="' + x(nowD).toFixed(1) + '" cy="' + ly(nowV).toFixed(1) + '" r="3.2" fill="var(--page)" stroke="var(--chart)" stroke-width="1.5"/>');
      tip(x(nowD), ly(nowV), "Now (thesis at its latest commit): " + fmtN(nowV) + " " + unitName(TL.unit));
    }
    // section rows
    var y0 = top + lenH + 10;
    out.push('<line x1="0" x2="' + (W - R) + '" y1="' + (y0 - 4) + '" y2="' + (y0 - 4) + '" stroke="var(--ink)"/>');
    var rowY = {};
    rows.forEach(function (r, i) {
      var cy = y0 + i * rowH + rowH / 2;
      rowY[r.id] = cy;
      out.push('<text class="rowlab l' + r.level + '" x="' + (r.level > 1 ? 14 : 0) + '" y="' + (cy + 5) + '" data-goto="' + esc(r.id) + '"><tspan fill="var(--ink-3)" font-weight="400">' + esc(r.id) + '</tspan> ' + esc(r.title.length > 22 ? r.title.slice(0, 21) + "…" : r.title) + '<title>' + esc(r.id + " " + r.title) + '</title></text>');
      if (i) out.push('<line x1="0" x2="' + (W - R) + '" y1="' + (cy - rowH / 2) + '" y2="' + (cy - rowH / 2) + '" stroke="var(--rule-soft)"/>');
    });
    (TL.events || []).forEach(function (e) {
      var r = rowOf(rows, e.section); if (!r) return;
      var cx = x(e.timestamp), cy = rowY[r.id], name = (e.section !== r.id ? e.section + " · " : "");
      if (e.kind === "grade") {
        out.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy + '" r="4" fill="var(--chart)" stroke="var(--page)" stroke-width="1.5"/>');
        tip(cx, cy, name + "Graded " + fmtDate(e.timestamp) + (e.low_confidence ? " (low confidence)" : ""), ' data-goto="' + esc(e.section) + '"');
      } else if (e.kind === "not_ready") {
        out.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy + '" r="3.5" fill="var(--page)" stroke="var(--ink-3)" stroke-width="1.3"/>');
        tip(cx, cy, name + "Not ready to grade · " + fmtDate(e.timestamp), ' data-goto="' + esc(e.section) + '"');
      } else if (e.kind === "respond") {
        out.push('<line x1="' + cx.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y1="' + (cy + 6) + '" y2="' + (cy + 11) + '" stroke="var(--ink-2)" stroke-width="1.4"/>');
        tip(cx, cy + 8, name + "You answered comments · " + fmtDate(e.timestamp), ' data-goto="' + esc(e.section) + '"');
      }
    });
    // milestones: a flag in each of their section rows; plain dates as a faint rule through the rows
    (TL.milestones || []).forEach(function (m) {
      var st = msState(m), cx = x(m.date), col = st === "missed" ? "var(--red)" : st === "met" || st === "late" ? "var(--ink)" : "var(--ink-3)";
      var text = fmtDay(m.date) + ": " + msName(m) + " · " + msStateText(m);
      if (!m.sections.length) {
        out.push('<line x1="' + cx.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y1="' + y0 + '" y2="' + (y0 + rows.length * rowH) + '" stroke="var(--rule)" stroke-dasharray="1 3"/>');
        tip(cx, y0 + 6, text);
        return;
      }
      var seen = {};
      m.sections.forEach(function (sid) {
        var r = rowOf(rows, sid); if (!r || seen[r.id]) return; seen[r.id] = 1;
        var cy = rowY[r.id], t = cy - rowH / 2 + 4;
        out.push('<line x1="' + cx.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y1="' + t + '" y2="' + (t + rowH - 8) + '" stroke="' + col + '" stroke-width="' + (st === "missed" ? 1.6 : 1) + '"/>' +
          '<path d="M' + cx.toFixed(1) + ' ' + t + 'h7l-2.5 3l2.5 3h-7z" fill="' + col + '"/>');
        tip(cx + 3, t + 3, text);
      });
    });
    // commits: one tick per day, taller with more commits
    var cy0 = y0 + rows.length * rowH + comH - 6, cmax = Math.max.apply(null, (TL.commits || []).map(function (c) { return c[1]; }).concat([1]));
    var ncommits = (TL.commits || []).reduce(function (n, c) { return n + c[1]; }, 0);
    out.push('<line x1="0" x2="' + (W - R) + '" y1="' + (y0 + rows.length * rowH) + '" y2="' + (y0 + rows.length * rowH) + '" stroke="var(--ink)"/>' +
      '<text class="cap" x="0" y="' + (cy0 - 4) + '">Commits</text><text class="tick" x="72" y="' + (cy0 - 4) + '">' + ncommits + '</text>');
    (TL.commits || []).forEach(function (c) {
      var cx = x(c[0]), h = 4 + c[1] / cmax * 12;
      out.push('<line x1="' + cx.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y1="' + cy0 + '" y2="' + (cy0 - h).toFixed(1) + '" stroke="var(--ink-3)" stroke-width="1.4"/>');
      tip(cx, cy0 - h / 2, fmtDay(c[0]) + ": " + plural(c[1], "commit"));
    });
    // today and the deadline run through every row
    var ty = top - 6, tx = x(today);

      (ok.length ? '<details class="closed" style="margin-top:12px"><summary><span class="caps">Matching</span><span class="tog">' + plural(ok.length, "quote") + '</span></summary><ol class="entries">' + ok.map(quoteEntry).join("") + '</ol></details>' : '') + '</div></section>';
    var B = C.bib || [];

      (B.length ? '<ul class="list">' + B.map(function (b) {
        var k = BIBKIND[b.kind] || [b.kind, ""];
        return '<li><span class="' + (k[1] ? 'red' : '') + '">' + esc(k[0]) + (b.fields ? ' ' + esc(b.fields.join(", ")) : '') + '</span>' + (b.key ? ' <span class="mono">' + esc(b.key) + '</span>' : '') +
          ' <span class="muted">· ' + (b.file ? '<span class="mono">' + esc(b.file.replace(/^.*\//, "")) + (b.line ? ':' + b.line : '') + '</span>' : '') + (b.detail ? ' ' + esc(b.detail) : '') + (b.count > 1 ? ' · cited ' + b.count + '×' : '') + '</span></li>';

  var OPEN_ICON = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M5 2.5H2.5v7h7V7M7 2.5h2.5V5M9.5 2.5 5.5 6.5"/></svg>';
  var paperName = function (r) { return r.cite_key || r.pdf.replace(/^.*\//, ""); };

  function paperPanel() {

  function passage(r, k, i) {
    var a = k.anchor || {};
    var page = a.page || k.page;
    var st = a.status === "unresolved" ? '<span class="anchor-state">passage not found in the PDF</span>'
      : a.status === "relocated" ? '<span class="anchor-state">found on p. ' + esc(a.page) + (k.page ? ', not p. ' + esc(k.page) : '') + '</span>'
      : a.status === "visual" ? '<span class="anchor-state" style="color:var(--ink-3)">read from the page image</span>' : '';
    var where = (a.section || []).length ? '<div class="where">' + a.section.map(esc).join('<span class="sep" aria-hidden="true">›</span>') + '</div>' : '';
    var crops = (a.crops || []).map(function (c) {
      var b = c.box, w = (b[2] - b[0]) * a.size[0], h = (b[3] - b[1]) * a.size[1];
      var pct = function (v, lo, span) { return ((v - lo) / span * 100).toFixed(2) + "%"; };
      var washes = c.lines.map(function (l) {
        var pad = 0.18 * (l[3] - l[1]);
        return '<span class="wash" style="left:' + pct(l[0] - pad / 2, b[0], b[2] - b[0]) + ';top:' + pct(l[1] - pad, b[1], b[3] - b[1]) +
          ';width:' + ((l[2] - l[0] + pad) / (b[2] - b[0]) * 100).toFixed(2) + '%;height:' + ((l[3] - l[1] + 2 * pad) / (b[3] - b[1]) * 100).toFixed(2) + '%"></span>';
      }).join("");
      // the crop fills the panel up to 1.5x print size, never below print size: on a phone it scrolls sideways instead
      return c.src ? '<div class="excerpt-frame"><figure class="excerpt" style="aspect-ratio:' + w.toFixed(1) + ' / ' + h.toFixed(1) +
        ';width:min(100%, ' + (w * 1.5).toFixed(0) + 'px);min-width:' + w.toFixed(0) + 'px">' +
        '<img src="' + esc(c.src) + '" alt="' + esc(k.quote) + '" onerror="margiNoCrop(this)">' + '<span aria-hidden="true">' + washes + '</span></figure></div>' : '';
    }).join("");
    var href = (r.href || "../" + r.pdf) + (page ? "#page=" + page : "");

      (k.why ? '<div class="note">' + esc(k.why) + '</div>' : '') +
      '<a class="open" href="' + esc(href) + '" target="_blank" rel="noopener">' + (page ? 'Open p. ' + esc(page) + ' in the PDF' : 'Open the PDF') + OPEN_ICON + '</a></div></li>';
  }

  // a crop that doesn't load: the PDF isn't on this machine, changed since it was read, or isn't rendered yet
  window.margiNoCrop = function (img) {

      var p = document.createElement("p");
      p.className = "missing";
      p.textContent = "The page image isn’t on this machine. Put the PDF back into the literature folder and run any margi command to render it.";
      fig.parentNode.insertBefore(p, fig);

    item.classList.add("no-pdf");
    fig.remove();
  };

  var TODO_BY = { student: "by you", margi: "on margi's evidence", github: "closed on GitHub" };
  var todosFor = function (ref) { return D.todos.filter(function (t) { return t.state === "open" && t.comments.some(function (c) { return c.ref === ref; }); }); };
  function todoMeta(t) {
    var bits = [];
    if (t.section) bits.push('<a href="#tab=sections&s=' + encodeURIComponent(t.section) + '" data-goto="' + esc(t.section) + '">' + esc(t.section) + '</a>');
    if (t.comments.length) bits.push('from ' + t.comments.map(function (c) { return esc(c.ref) + (c.state ? ' <span class="muted">' + esc(STATE_LABEL_JS[c.state] || c.state) + '</span>' : ''); }).join(', '));
    if (t.issue) bits.push('#' + esc(t.issue));
    return bits.length ? '<div class="tmeta">' + bits.join(' · ') + '</div>' : '';
  }
  var STATE_LABEL_JS = { open: "open", addressed: "addressed", disputed: "disputed", wont_fix: "won’t fix", resolved: "resolved", withdrawn: "withdrawn" };
  function todosView() {
    var T = D.todos;
    if (!T.length) return '<div class="sheet empty"><h3>No todos</h3><p>margi proposes todos from your comments and ratings; you accept, reject or change them. ' +
      (D.todo_sync ? 'Accepted todos also become GitHub issues.' : 'They stay in <code>margi/todos/</code>; GitHub is optional.') + '</p><p>' + cmdChip("/margi todos") + '</p></div>';
    var open = T.filter(function (t) { return t.state === "open"; });
    var waiting = T.filter(function (t) { return t.kind === "proposed" || t.kind === "close"; });
    var done = T.filter(function (t) { return t.state === "done"; }).sort(function (a, b) { return String(b.done_at).localeCompare(String(a.done_at)); });
    var titleOf = function (id) { var t = T.filter(function (x) { return x.id === id; })[0]; return t ? t.title : id; };
    var openList = open.length ? '<ol class="entries todos">' + open.map(function (t) {
      var picked = state.tpick.indexOf(t.id) >= 0;
      return '<li class="entry' + (picked ? ' picked' : '') + '"><span class="loc">' + esc(t.id.replace(/^t\d{4}/, "")) + '</span><div>' +
        '<div class="ttitle">' + esc(t.title) + '</div>' + todoMeta(t) +
        '<div class="cstate"><span>' + (t.comments_closed ? '<span class="caps">Its comments are closed</span>' : '') + '</span>' +
        '<label class="pick"><input type="checkbox" data-pick="' + esc(t.id) + '"' + (picked ? ' checked' : '') + ' aria-label="Mark ' + esc(t.title) + ' done"><span aria-hidden="true">Done</span></label></div></div></li>';
    }).join("") + '</ol>' : '<p class="muted">No open todos.</p>';
    var waitList = waiting.length ? '<ul class="list">' + waiting.map(function (t) {
      var what = t.kind === "close" ? 'Close: ' + esc(titleOf(t.todo || t.id)) : esc(t.title);
      return '<li>' + what + ' <span class="muted">· ' + (t.status === "accepted" ? 'accepted, not applied yet' : t.kind === "close" ? 'margi found evidence' : 'proposed') + '</span></li>';
    }).join("") + '</ul><p>' + cmdChip("/margi todos") + '</p>' : '';
    var doneList = done.length ? '<details class="block closed"' + (state.todoDoneOpen ? ' open' : '') + ' id="tdone"><summary><span class="caps">Done</span><span class="tog">' + plural(done.length, "todo") + '</span></summary><ul class="list">' +
      done.map(function (t) {
        return '<li>' + esc(t.title) + ' <span class="muted">· ' + (t.done_at ? fmtDate(t.done_at, false, true) + ' ' : '') + esc(TODO_BY[t.done_by] || "") + '</span>' +
          (t.note ? '<div class="thread" style="margin-top:4px"><span class="who you caps">You</span> <q class="said">' + esc(t.note) + '</q></div>' : '') + '</li>';
      }).join("") + '</ul></details>' : '';
    return '<div class="split"><section class="sheet pad"><div class="block" style="margin-top:0"><h3><span class="caps">Open</span><span class="muted" style="font-size:14px">' + open.length +
      (D.todo_sync ? ' · mirrored to GitHub' : '') + '</span></h3>' + openList +
      (open.length ? '<p class="lcnote">Tick what you have finished; margi records it under your name.</p>' : '') + '</div>' + doneList + respondBar() + '</section>' +
      (waitList ? '<section class="sheet pad"><div class="block" style="margin-top:0"><h3><span class="caps">Waiting for your review</span><span class="muted" style="font-size:14px">' + waiting.length + '</span></h3>' + waitList + '</div></section>' : '<div></div>') + '</div>';
  }

  function runsView() {
    if (!D.runs.length) return '<div class="sheet empty"><h3>No runs yet</h3><p>Every margi command leaves a provenance-stamped record in <code>margi/feedback/</code>. They will be listed here.</p></div>';
    return '<div class="sheet"><table class="plain"><thead><tr><th class="caps">When</th><th class="caps">Command</th><th class="caps">Scope</th><th class="caps hide-s">Model</th><th class="caps hide-s">Summary</th></tr></thead><tbody>' +
      D.runs.map(function (r) {
        return '<tr><td style="white-space:nowrap">' + fmtDate(r.timestamp, true) + '</td><td>' + esc(r.command) + '</td><td>' + esc(r.scope) + '</td><td class="hide-s muted">' + esc(r.model || "—") + '</td><td class="why hide-s">' + esc(r.summary) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<p class="muted" style="font-size:15px">The full audit trail is <code>git log -- margi/</code>.</p>';
  }

  // ------------------------------------------------------------------ render + events
  function render(opts) {
    renderTabs();
    var v = $("view");
    var views = { sections: sectionsView, timeline: timelineView, submission: submissionView, docs: docsView, literature: literatureView, todos: todosView, runs: runsView };
    if (!views[state.tab]) state.tab = "sections";
    v.setAttribute("aria-labelledby", "tab-" + state.tab);
    v.innerHTML = views[state.tab]();
    if (opts && opts.enter) { var a = $("apparatus"); if (a) { a.classList.add("enter"); } }
    var tw = $("tlwrap"), tl = tw && tw.querySelector(".tlchart");
    if (tl && tw.scrollWidth > tw.clientWidth) { // a narrow screen opens the chart at today
      var t = tl.querySelector("[data-today]");
      if (t) tw.scrollLeft = Number(t.getAttribute("x1")) - tw.clientWidth * 0.6;
    }
    writeHash(opts && opts.push);
  }
  function select(sid, focusPanel) {
    var moved = state.sel !== sid;
    if (moved) { state.run = null; state.sev = "all"; state.cat = "all"; state.pick = []; state.closedOpen = false; }
    state.sel = sid; state.tab = "sections";
    render({ enter: true, push: moved && focusPanel });
    var a = $("apparatus");
    if (a) a.scrollTop = 0;
    if (focusPanel && a && window.matchMedia("(max-width: 1080px)").matches) a.scrollIntoView({ block: "start" });
  }

  function selectPaper(pdf, focusPanel) {
    var moved = state.paper !== pdf;
    state.paper = pdf; state.tab = "literature";
    render({ enter: true, push: moved && focusPanel });
    var a = $("apparatus");
    if (a) a.scrollTop = 0;
    if (focusPanel && a && window.matchMedia("(max-width: 1080px)").matches) a.scrollIntoView({ block: "start" });
  }

  $("view").addEventListener("click", function (e) {
    var go = e.target.closest("[data-goto]");
    if (go) { e.preventDefault(); select(go.getAttribute("data-goto"), true); return; }
    var ref = e.target.closest("[data-ref]");
    if (ref) { e.preventDefault(); showEntry(ref.getAttribute("data-ref")); return; }
    if (e.target.closest("[data-unpick]")) { state[state.tab === "todos" ? "tpick" : "pick"] = []; updatePicks(); return; }
    if (e.target.closest("[data-pick], .pick")) return;
    var sev = e.target.closest("[data-sev]");
    if (sev) { state.sev = sev.getAttribute("data-sev"); rerenderPanel(); return; }
    var show = e.target.closest("[data-show]");
    if (show) { state.show = show.getAttribute("data-show"); render(); var nb = document.querySelector('[data-show="' + state.show + '"]'); if (nb) nb.focus(); return; }
    if (e.target.closest("[data-copy]") || e.target.closest("a, select, summary")) return;
    var pg = e.target.closest("[data-paper]");
    if (pg) { e.preventDefault(); selectPaper(pg.getAttribute("data-paper"), true); return; }
    var ptr = e.target.closest("tr[data-pdf]");
    if (ptr) { selectPaper(ptr.getAttribute("data-pdf"), true); var pb = document.querySelector('.ptitle[data-pdf="' + CSS.escape(state.paper) + '"]'); if (pb) pb.focus({ preventScroll: true }); return; }
    var tr = e.target.closest("tr[data-sid]");
    if (tr) { select(tr.getAttribute("data-sid"), true); var b = document.querySelector('.stitle[data-sid="' + CSS.escape(state.sel) + '"]'); if (b) b.focus({ preventScroll: true }); }
  });
  $("view").addEventListener("change", function (e) {
    var pk = e.target.getAttribute && e.target.getAttribute("data-pick");
    if (pk) {
      var key = state.tab === "todos" ? "tpick" : "pick";
      state[key] = state[key].filter(function (r) { return r !== pk; });
      if (e.target.checked) state[key].push(pk);
      updatePicks(); return;
    }
    if (e.target.id === "catsel") { state.cat = e.target.value; rerenderPanel(); }
    if (e.target.id === "runsel") { state.run = Number(e.target.value); rerenderPanel(); }
  });
  $("view").addEventListener("keydown", function (e) {
    var pb = e.target.closest(".ptitle");
    if (pb && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      var ps = Array.prototype.slice.call(document.querySelectorAll(".ptitle"));
      var j = ps.indexOf(pb) + (e.key === "ArrowDown" ? 1 : -1);
      if (j < 0 || j >= ps.length) return;
      selectPaper(ps[j].getAttribute("data-pdf"));
      var np = document.querySelector('.ptitle[data-pdf="' + CSS.escape(state.paper) + '"]');
      if (np) np.focus();
      return;
    }
    var b = e.target.closest(".stitle");
    if (!b || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
    e.preventDefault();
    var all = Array.prototype.slice.call(document.querySelectorAll(".stitle"));
    var i = all.indexOf(b) + (e.key === "ArrowDown" ? 1 : -1);
    if (i < 0 || i >= all.length) return;
    select(all[i].getAttribute("data-sid"));
    var nb = document.querySelector('.stitle[data-sid="' + CSS.escape(state.sel) + '"]');
    if (nb) { nb.focus(); }
  });
  $("view").addEventListener("pointermove", function (e) {
    var wrap = e.target.closest(".tlwrap");
    if (wrap) {
      var tt = wrap.querySelector(".tip"), h = e.target.closest(".hit");
      if (!h) { tt.classList.remove("on"); return; }
      tt.textContent = h.getAttribute("data-tip");
      tt.style.left = (Number(h.getAttribute("data-x")) + 16) + "px"; // the chart sits inside the wrap's 16px padding
      tt.style.top = (Number(h.getAttribute("data-y")) + 16) + "px";
      tt.classList.add("on");
      return;
    }
    var hit = e.target.closest(".hit");
    document.querySelectorAll(".mult .tip.on").forEach(function (t) { if (!hit || t.parentNode !== hit.closest(".mult")) t.classList.remove("on"); });
    if (!hit) return;
    var fig = hit.closest(".mult"), tip = fig.querySelector(".tip"), svg = fig.querySelector("svg");
    tip.textContent = hit.getAttribute("data-tip");
    tip.style.left = hit.getAttribute("data-x") + "%";
    tip.style.top = (svg.offsetTop + Number(hit.getAttribute("data-y")) / 72 * svg.clientHeight) + "px";
    tip.classList.add("on");
  });
  $("view").addEventListener("toggle", function (e) {
    if (e.target.id === "closed") state.closedOpen = e.target.open;
    if (e.target.id === "tdone") state.todoDoneOpen = e.target.open;
  }, true);
  function rerenderPanel() {
    var a = $("apparatus"); if (!a) return;
    // keep keyboard focus on the control that triggered the re-render
    var f = document.activeElement, key = null;
    if (f && a.contains(f)) key = f.id ? "#" + f.id : f.getAttribute("data-sev") ? '[data-sev="' + f.getAttribute("data-sev") + '"]' : null;
    var y = a.scrollTop; a.classList.remove("enter"); a.innerHTML = apparatus(); a.scrollTop = y;
    var nf = key && a.querySelector(key); if (nf) nf.focus({ preventScroll: true });
  }
  function showEntry(id) {
    var a = $("apparatus"); if (!a) return;
    var el = $(id);
    if (!el) { state.sev = "all"; state.cat = "all"; state.closedOpen = true; rerenderPanel(); el = $(id); }
    var box = el && el.closest("details.closed"); if (box && !box.open) { box.open = true; state.closedOpen = true; }
    if (!el) return;
    el.setAttribute("tabindex", "-1"); el.classList.add("hl");
    el.scrollIntoView({ block: "nearest" }); el.focus({ preventScroll: true });
    setTimeout(function () { el.classList.remove("hl"); }, 1600);
  }
  function onHash() {
    var before = state.sel + "|" + state.paper + "|" + state.tab; readHash();
    if (before !== state.sel + "|" + state.paper + "|" + state.tab) render({ enter: true });
  }
  window.addEventListener("hashchange", onHash);
  window.addEventListener("popstate", onHash);
  // the running head wraps on small screens; sticky offsets need its real height
  function measureHead() { document.documentElement.style.setProperty("--head-real", ($("head").offsetHeight + 4) + "px"); }
  window.addEventListener("resize", measureHead);
  var lastW = 0;
  window.addEventListener("resize", function () {
    var w = $("view").clientWidth;
    if (state.tab === "timeline" && Math.abs(w - lastW) > 40) { lastW = w; render(); }
  });

  readHash();
  renderHead();
  renderStatus();
  renderStrip();
  render();
  measureHead();
})();
</script>
</body>
</html>
