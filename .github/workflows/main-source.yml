name: main-source

# Releases come from develop only. Make this check required in the branch
# protection rule for main (Settings → Branches) so other PRs can't be merged.
on:
  pull_request:
    branches: [main]

jobs:
  from-develop:
    runs-on: ubuntu-latest
    steps:
      - name: PR into main must come from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PRs into main must come from develop (got '${{ github.head_ref }}')."
            exit 1
          fi
